worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Plain round-robin (the nginx default) across the 3 app instances. Each backend
    # shares the same Redis, so the *global* token bucket for a given client is
    # enforced consistently no matter which instance nginx happens to route a
    # request to — this is the core "distributed" proof point of Phase 3.
    upstream ratelimiter_backend {
        server app-instance-1:8080;
        server app-instance-2:8080;
        server app-instance-3:8080;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ratelimiter_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Let clients see rate-limit headers/bodies verbatim; nginx must not
            # buffer/alter the app's 429 response in a way that hides them.
            proxy_pass_request_headers on;
        }
    }
}
