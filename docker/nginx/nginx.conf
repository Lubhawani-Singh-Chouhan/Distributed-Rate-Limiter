worker_processes auto;
worker_rlimit_nofile 16384;

events {
    # Must be >= the ~5k at-once burst we size the app for; the previous 1024 cap
    # would refuse / queue-overflow connections before they reached Tomcat.
    worker_connections 8192;
    multi_accept on;
}

http {
    # Plain round-robin (the nginx default) across the 3 app instances. Each backend
    # shares the same Redis, so the *global* token bucket for a given client is
    # enforced consistently no matter which instance nginx happens to route a
    # request to — this is the core "distributed" proof point of Phase 3.
    upstream ratelimiter_backend {
        server app-instance-1:8080;
        server app-instance-2:8080;
        server app-instance-3:8080;
        keepalive 256;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://ratelimiter_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Let clients see rate-limit headers/bodies verbatim; nginx must not
            # buffer/alter the app's 429 response in a way that hides them.
            proxy_pass_request_headers on;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
    }
}
