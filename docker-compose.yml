services:
  redis:
    image: redis:7-alpine
    container_name: ratelimiter-redis
    command: redis-server --save "" --appendonly no --tcp-backlog 511 --tcp-keepalive 60 --maxclients 20000 --hz 100
    networks:
      - ratelimiter-net
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  app-instance-1: &app-instance
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app-instance-1
    networks:
      - ratelimiter-net
    depends_on:
      redis:
        condition: service_healthy
    environment: &app-instance-env
      REDIS_HOST: redis
      REDIS_PORT: 6379
      SERVER_PORT: 8080
      INSTANCE_ID: app-instance-1
      # Heap sized for a ~5k concurrent burst on virtual threads (cheap stacks).
      # Override downward (e.g. `-Xmx384m`) on memory-constrained Docker Desktop VMs.
      JAVA_OPTS: "-Xms256m -Xmx768m -Xss256k -XX:+UseG1GC -XX:MaxGCPauseMillis=20 -XX:+AlwaysPreTouch -Djava.net.preferIPv4Stack=true"
    mem_limit: 1g
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  app-instance-2:
    <<: *app-instance
    container_name: app-instance-2
    environment:
      <<: *app-instance-env
      INSTANCE_ID: app-instance-2
    ports:
      - "8082:8080"

  app-instance-3:
    <<: *app-instance
    container_name: app-instance-3
    environment:
      <<: *app-instance-env
      INSTANCE_ID: app-instance-3
    ports:
      - "8083:8080"

  nginx:
    image: nginx:1.27-alpine
    container_name: ratelimiter-nginx
    networks:
      - ratelimiter-net
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - app-instance-1
      - app-instance-2
      - app-instance-3

networks:
  ratelimiter-net:
    driver: bridge

# Future work: swap the single `redis` service for a Redis Cluster/Sentinel topology
# for HA once a single node becomes a bottleneck or single point of failure (see README).
