spring:
  application:
    name: distributed-rate-limiter
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      lettuce:
        pool:
          enabled: true
          max-active: ${REDIS_POOL_MAX_ACTIVE:32}
          max-idle: ${REDIS_POOL_MAX_IDLE:16}
          min-idle: ${REDIS_POOL_MIN_IDLE:4}
          max-wait: 500ms
        shutdown-timeout: 200ms

server:
  port: ${SERVER_PORT:8080}
  tomcat:
    threads:
      # Spring Boot's Tomcat default (200 max threads) is sized for a dedicated host, not
      # 3 co-located instances sharing a memory-constrained Docker Desktop VM - each thread
      # carries its own ~1MB stack, so 3 x 200 = 600 threads alone can add ~600MB of stack
      # memory under concurrent load. This keeps the demo's resource footprint predictable;
      # raise it (env var, no rebuild needed) if load-testing on more capable hardware.
      max: ${SERVER_TOMCAT_MAX_THREADS:100}
      min-spare: ${SERVER_TOMCAT_MIN_SPARE_THREADS:10}

ratelimiter:
  enabled: true
  default-capacity: 50
  default-refill-rate: 10 # tokens/sec
  key-strategy: api-key # api-key | ip | user-id
  api-key-header: X-API-Key
  excluded-paths:
    - /actuator/health
    - /actuator/health/**
    - /api/v1/limiter/**
  # Per-endpoint overrides go here, e.g.:
  #   endpoints:
  #     /api/v1/some-path:
  #       capacity: 20
  #       refill-rate: 5
  # /api/v1/resource intentionally has none, so it uses the global default bucket
  # (scope "default") - the same one /api/v1/limiter/status?clientKey=... inspects.
  # /api/v1/orders demonstrates the override mechanism instead, via the
  # @RateLimit annotation directly on DemoController#createOrder/getLatestOrder.
  endpoints: {}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.ratelimiter.distributed: INFO
